<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Primeiro Acesso - GestSaúde</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="pagina-login">

    <div class="login-container">

        <h1 class="titulo-formulario">Primeiro Acesso</h1>
        
        <form action="">
            
            <div class="grupamento">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="grupamento">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="usuario@gmail.com" required>
            </div>

            <div class="grupamento">
                <label for="senha">Crie uma Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Crie sua senha" required>
            </div>
            
            <button type="submit" class="button-submit">Cadastrar</button>

            <div class="footer-links">
                <a href="login.html"><i class="fa-solid fa-arrow-left"></i> Já possuo uma conta</a>
            </div>

        </form>

    </div>

</body>

</html>
