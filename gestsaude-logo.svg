<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560">
  <defs>
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5BC8D6"/>
      <stop offset="45%" stop-color="#2E8FBF"/>
      <stop offset="100%" stop-color="#123A63"/>
    </linearGradient>
    <linearGradient id="textGradientDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#123A63"/>
      <stop offset="100%" stop-color="#1B4E7E"/>
    </linearGradient>
    <linearGradient id="textGradientLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E7EA6"/>
      <stop offset="100%" stop-color="#1E5B87"/>
    </linearGradient>
  </defs>

  <!-- Heart shape (point down) -->
  <path d="M240,150
           C240,110 205,75 165,75
           C118,75 82,113 82,160
           C82,225 155,285 240,360
           C325,285 398,225 398,160
           C398,113 362,75 315,75
           C275,75 240,110 240,150 Z"
        fill="url(#heartGradient)"/>

  <!-- ECG / heartbeat pulse line, clipped inside heart -->
  <clipPath id="heartClip">
    <path d="M240,150
             C240,110 205,75 165,75
             C118,75 82,113 82,160
             C82,225 155,285 240,360
             C325,285 398,225 398,160
             C398,113 362,75 315,75
             C275,75 240,110 240,150 Z"/>
  </clipPath>
  <g clip-path="url(#heartClip)">
    <polyline points="60,225 140,225 165,175 195,270 225,150 250,225 420,225"
              fill="none" stroke="#F4FAFC" stroke-width="14"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Medical cross (plus) accent, upper right -->
  <g transform="translate(300,95)">
    <rect x="-46" y="-14" width="92" height="28" rx="6" fill="#F4FAFC"/>
    <rect x="-14" y="-46" width="28" height="92" rx="6" fill="#F4FAFC"/>
    <rect x="-38" y="-9" width="76" height="18" rx="4" fill="#2E8FBF"/>
    <rect x="-9" y="-38" width="18" height="76" rx="4" fill="#2E8FBF"/>
  </g>

  <!-- Wordmark -->
  <text x="240" y="460" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="66">
    <tspan fill="url(#textGradientDark)">GEST</tspan><tspan fill="url(#textGradientLight)">SA&#218;DE</tspan>
  </text>
</svg>
